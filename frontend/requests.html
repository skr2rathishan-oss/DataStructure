<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requests - SmartCloudStorage</title>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h1>Storage</h1>
            <ul class="nav-links">
                <li><a href="files.html">Files</a></li>
                <li><a href="permissions.html">Permissions</a></li>
                <li><a href="requests.html" class="active">Access Requests</a></li>
                <li><a href="trash.html">Trash</a></li>
                <li><a href="#" id="logoutBtn" style="color: var(--danger-red); margin-top: 2rem;">Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h2>Access Requests (Queue)</h2>
            
            <div class="card">
                <h3>Request Access to a File</h3>
                <form id="requestForm" style="display: flex; gap: 1rem; align-items: flex-end; margin-top: 1rem;">
                    <div class="input-group" style="margin-bottom: 0;">
                        <label>Owner Username</label>
                        <input type="text" id="ownerName" required>
                    </div>
                    <div class="input-group" style="margin-bottom: 0;">
                        <label>File ID</label>
                        <input type="number" id="fileId" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Request Access</button>
                </form>
            </div>

            <div class="card" id="processSection">
                <h3>Process Next Request</h3>
                <div id="nextRequestInfo" style="padding: 1rem; background: var(--canvas-white); border-radius: 0.5rem; border: 1px solid var(--whisper-border); margin-bottom: 1rem;">
                    Loading...
                </div>
                <div style="display: flex; gap: 1rem;">
                    <button id="btnApprove" class="btn btn-primary" disabled>Approve</button>
                    <button id="btnReject" class="btn btn-danger" disabled>Reject</button>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/requests.js"></script>
</body>
</html>
