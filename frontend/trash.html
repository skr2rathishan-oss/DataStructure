<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trash - SmartCloudStorage</title>
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <h1>Storage</h1>
            <ul class="nav-links">
                <li><a href="files.html">Files</a></li>
                <li><a href="permissions.html">Permissions</a></li>
                <li><a href="requests.html">Access Requests</a></li>
                <li><a href="trash.html" class="active">Trash</a></li>
                <li><a href="#" id="logoutBtn" style="color: var(--danger-red); margin-top: 2rem;">Logout</a></li>
            </ul>
        </aside>
        <main class="main-content">
            <h2>Trash (Stack)</h2>
            
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem;">
                    <div>
                        <h3 style="margin-bottom: 0.35rem;">Deleted Files</h3>
                        <p style="color: var(--muted-steel);">Trash uses stack behavior, so restore brings back the most recently deleted file first.</p>
                    </div>
                    <button id="btnRestore" class="btn btn-primary">Restore Last File</button>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Owner</th>
                                <th>Visibility</th>
                                <th>Size</th>
                            </tr>
                        </thead>
                        <tbody id="trashTableBody">
                            <tr><td colspan="5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/trash.js"></script>
</body>
</html>
